version: 3
projects:
  - name: dev
    dir: environments/dev
    autoplan:
      when_modified:
        - "**/*.hcl"
        - "../../terragrunt.hcl"
        - "../../modules/**/*.tf"
      enabled: true
  - name: dev-fargate
    dir: environments/dev-fargate
    autoplan:
      when_modified:
        - "**/*.hcl"
        - "../../terragrunt.hcl"
        - "../../modules/**/*.tf"
      enabled: true

# Use workflow name "default" (do not set projects[].workflow) so strict Atlantis servers
# accept this file without allow_repo_config_workflow / allowed_overrides: [workflow].
workflows:
  default:
    plan:
      steps:
        - env:
            name: TERRAGRUNT_TFPATH
            command: 'echo "terraform${ATLANTIS_TERRAFORM_VERSION}"'
        - env:
            name: TF_IN_AUTOMATION
            value: "true"
        - run:
            command: terragrunt plan -input=false -out=$PLANFILE
            output: strip_refreshing
    apply:
      steps:
        - env:
            name: TERRAGRUNT_TFPATH
            command: 'echo "terraform${ATLANTIS_TERRAFORM_VERSION}"'
        - env:
            name: TF_IN_AUTOMATION
            value: "true"
        - run: terragrunt apply -input=false $PLANFILE

# Image must include Terragrunt. If your server still rejects repo workflows, set
# allow_custom_workflows: true (see docker/atlantis/repos.yaml).
