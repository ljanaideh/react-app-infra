version: 3
# Projects only — no workflows: here. Terragrunt steps live on the Atlantis SERVER
# (see docker/atlantis/repos.yaml or docs/atlantis-server-config.example.yaml). Hosted
# Atlantis cannot run custom workflows from this repo unless the server sets
# allow_custom_workflows: true; moving workflows server-side avoids that requirement.
# If PR checks run `terraform plan` (not `terragrunt plan`), the server is not using that
# repo-config — plain Terraform sees no *.tf here and provider install/plan will fail.
projects:
  - name: dev
    dir: environments/dev
    autoplan:
      when_modified:
        - "**/*.hcl"
        - "../../terragrunt.hcl"
        - "../../modules/**/*.tf"
      enabled: true
  - name: dev-fargate
    dir: environments/dev-fargate
    autoplan:
      when_modified:
        - "**/*.hcl"
        - "../../terragrunt.hcl"
        - "../../modules/**/*.tf"
      enabled: true
